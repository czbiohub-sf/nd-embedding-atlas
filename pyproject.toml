[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling", "uv-dynamic-versioning" ]

[project]
name = "ome-atlas"
description = "An interactive browser-based dashboard that bridges the gap between abstract AI embeddings and biological ground truth by linking high-dimensional feature points directly to their source 5D image data for rapid exploration and annotation."
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Sricharan Reddy Varra", email = "sricharan.varra@biohub.org" },
]
authors = [ { name = "Sricharan Reddy Varra" } ]
requires-python = ">=3.12,<3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = [ "version" ]
dependencies = [
  "anndata>=0.12.9",
  "dask[dataframe,distributed]>=2025.9.2",
  "duckdb>=1.4.4",
  "fastapi>=0.128",
  "iohub==0.3.0a5",
  "obstore>=0.8.2",
  "pyarrow>=18",
  "rich>=14.3.1",
  "scanpy>=1.11.5",
  "session-info2",
  "structlog>=25.5",
  "typer>=0.21.1",
  "zarr>=3.1.5",
  "zarrs>=0.2.1",
]
# https://docs.pypi.org/project_metadata/#project-urls
urls.Documentation = "https://pages.github.com/czbiohub-sf/image-embedding-atlas"
urls.Homepage = "https://github.com/czbiohub-sf/image-embedding-atlas"
urls.Source = "https://github.com/czbiohub-sf/image-embedding-atlas"
scripts.ome-atlas = "ome_atlas.cli._app:app"

[dependency-groups]
dev = [ { include-group = "doc" }, { include-group = "test" } ]
test = [
  "coverage>=7.13.2",
  "pytest>=9.0.2",
  "pytest-cov>=7",
]
doc = [
  "ipykernel",
  "zensical>=0.0.21",
]

[tool.hatch.build.hooks.custom]
# Uses hatch_build.py at project root

[tool.hatch.build]
artifacts = [ "src/ome_atlas/_frontend" ]

[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "ome_atlas/_frontend"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.envs.default]
installer = "uv"
dependency-groups = [ "dev" ]

[tool.hatch.envs.docs]
dependency-groups = [ "doc" ]
scripts.build = "sphinx-build -M html docs docs/_build -W {args}"
scripts.open = "python -m webbrowser -t docs/_build/html/index.html"
scripts.clean = "git clean -fdX -- {args:docs}"

# Test the lowest and highest supported Python versions with normal deps
[[tool.hatch.envs.hatch-test.matrix]]
deps = [ "stable" ]
python = [ "3.12", "3.13" ]

# Test the newest supported Python version also with pre-release deps
[[tool.hatch.envs.hatch-test.matrix]]
deps = [ "pre" ]
python = [ "3.13" ]

[tool.hatch.envs.hatch-test]
dependency-groups = [ "test" ]

[tool.hatch.envs.hatch-test.overrides]
# If the matrix variable `deps` is set to "pre",
# set the environment variable `UV_PRERELEASE` to "allow".
matrix.deps.env-vars = [
  { key = "UV_PRERELEASE", value = "allow", if = [
    "pre",
  ] },
]

[tool.ruff]
line-length = 120
src = [ "src" ]
extend-include = [ "*.ipynb" ]

format.docstring-code-format = true

lint.select = [
  "B",    # flake8-bugbear
  "BLE",  # flake8-blind-except
  "C4",   # flake8-comprehensions
  "D",    # pydocstyle
  "E",    # Error detected by Pycodestyle
  "F",    # Errors detected by Pyflakes
  "I",    # isort
  "NPY",  # NumPy-specific rules
  "PD",   # Pandas code
  "PERF", # Perflint
  "PT",   # Pytest
  "PTH",  # pathlib
  "RUF",  # Ruff-specific rules
  "TID",  # flake8-tidy-imports
  "TRY",  # Tryceratops
  "UP",   # pyupgrade
  "W",    # Warning detected by Pycodestyle
]

lint.ignore = [
  "B008", # Errors from function calls in argument defaults. These are fine when the result is immutable.
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D105", # __magic__ methods are often self-explanatory, allow missing docstrings
  "D107", # Missing docstring in __init__
  # Disable one in each pair of mutually incompatible rules
  "D203", # We don’t want a blank line before a class docstring
  "D213", # <> We want docstrings to start immediately after the opening triple quote
  "D400", # first line should end with a period [Bug: doesn’t work with single-line docstrings]
  "D401", # First line should be in imperative mood; try rephrasing
  "E501", # line too long -> we accept long comment lines; formatter gets rid of long code lines
  "E731", # Do not assign a lambda expression, use a def -> lambda expression assignments are convenient
  "E741", # allow I, O, l as variable names -> I is the identity matrix
]
lint.per-file-ignores."*/__init__.py" = [ "F401" ]
lint.per-file-ignores."docs/*" = [ "I" ]
lint.per-file-ignores."tests/*" = [ "D" ]
lint.pydocstyle.convention = "numpy"

[tool.pytest]
strict = true
testpaths = [ "tests" ]
addopts = [
  "--import-mode=importlib", # allow using test files with same name
]

[tool.coverage.run]
source = [ "ome_atlas" ]
patch = [ "subprocess" ]
omit = [ "**/test_*.py" ]

[tool.cruft]
skip = [
  "tests",
  "src/**/__init__.py",
  "src/**/basic.py",
  "docs/api.md",
  "docs/changelog.md",
  "docs/references.bib",
  "docs/references.md",
  "docs/notebooks/example.ipynb",
]
