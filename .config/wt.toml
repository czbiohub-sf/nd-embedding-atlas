# nd-embedding-atlas worktree project config
# Runs for all team members when they create/merge worktrees

[post-create]
# Install frontend dependencies in every new worktree
frontend-deps = "cd frontend && pnpm install --frozen-lockfile"
# Sync Python dependencies
python-deps = "uv sync --all-groups"

[post-start]
# Start the Vite dev server in the background for interactive testing
# Logs go to .git/wt-logs/<branch>-post-start-dev-server.log
dev-server = "cd frontend && vp dev --port 0"

[pre-commit]
# Type-check + lint + fmt before every wt merge commit
check = "cd frontend && vp check"

[pre-merge]
# Full quality gate before merging
check = "cd frontend && vp check"
