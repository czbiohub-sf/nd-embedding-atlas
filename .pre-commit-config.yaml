fail_fast: false
default_language_version:
  python: python3
default_stages:
  - pre-commit
  - pre-push
minimum_pre_commit_version: 2.16.0
repos:
  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        language: system
        # No --fix: fail fast, let developer fix manually.
        # --deny-warnings promotes warnings to errors so nothing slips through.
        entry: bash -c 'cd frontend && vp lint --deny-warnings src'
        pass_filenames: false
        types_or: [ts, tsx]
        files: ^frontend/src/
        exclude: ^frontend/src/components/ui/
      - id: oxfmt
        name: oxfmt
        language: system
        # --check: verify without writing. Run 'vp fmt --write src' to fix.
        entry: bash -c 'cd frontend && vp fmt --check src'
        pass_filenames: false
        types_or: [ts, tsx, json, css]
        files: ^frontend/src/
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.11.1
    hooks:
      - id: pyproject-fmt
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        types_or: [python, pyi, jupyter]
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        types_or: [python, pyi, jupyter]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-ast
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
      - id: check-case-conflict
      # Check that there are no merge conflicts (could be generated by template sync)
      - id: check-merge-conflict
        args: [--assume-in-merge]
