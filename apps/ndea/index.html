<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./src/frontend/assets/favicon.svg" />
    <title>nd-embedding-atlas</title>
    <!-- Anti-FOUC: apply theme before React loads -->
    <script>
      (function () {
        var stored = localStorage.getItem("ndea-theme");
        var theme =
          stored === "light"
            ? "light"
            : stored === "dark"
              ? "dark"
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
        if (theme === "dark") document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/frontend/main.tsx"></script>
  <!-- impeccable-live-start -->
<script src="http://localhost:8400/live.js"></script>
<!-- impeccable-live-end -->
</body>
</html>
