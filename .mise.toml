# mise.toml — unified toolchain for nd-embedding-atlas (Bun binary)
# https://mise.jdx.dev

[tools]
node = "24"
# vp (vite-plus) is self-managed at ~/.vite-plus — update with: vp update
# bun is managed via packageManager field in package.json

[env]
NDEA_PORT = "5055"

[tasks.dev]
description = "Start backend + frontend dev server concurrently"
run = """
#!/bin/bash
set -e
bun run src/cli/index.ts "$@" --port $NDEA_PORT --no-static &
BACKEND=$!
trap "kill $BACKEND 2>/dev/null; wait $BACKEND 2>/dev/null" EXIT INT TERM
until curl -sf "http://localhost:$NDEA_PORT/data/metadata.json" >/dev/null 2>&1; do
  sleep 0.2
done
vp dev
"""

[tasks.dev-frontend]
description = "Frontend dev server only (assumes backend already running)"
run = "vp dev"

[tasks.sync]
description = "Sync all dependencies"
run = "bun install && bun install"

[tasks.check]
description = "Full quality gate: vp check (backend) + vp check (frontend)"
run = "vp check"

[tasks.build]
description = "Production build — frontend then Bun binary"
run = "bun run build"

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf dist"
