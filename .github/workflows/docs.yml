name: Docs

# Builds the Fumapress docs site under docs/ and deploys to GitHub Pages
# on every push to main. Pull requests run the build only (no deploy) so
# PR authors see breakage before merge.
#
# The docs app (docs/) is a standalone Fumadocs + Waku app with its own
# package.json / node_modules, isolated from the main project's deps. Waku
# emits static HTML to docs/dist/public.
#
# One-time setup: in repo Settings → Pages, set "Build and deployment →
# Source" to "GitHub Actions".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Build the static site (runs on PRs + pushes) ────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
      - uses: voidzero-dev/setup-vp@v1

      - id: pages
        name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: docs
        run: vp install --frozen-lockfile

      - name: Build docs
        # docs/ is intentionally outside the root workspace. Run its named
        # root task because `vp run build` from docs/ resolves the root build.
        env:
          DOCS_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: vp run docs:build

      # Serve the installer from the docs site, giving the one-liner a short
      # URL: https://czbiohub-sf.github.io/nd-embedding-atlas/install.sh
      #
      # Copied into the built output rather than kept in a framework `public/`
      # directory so that hosting does not depend on how Waku's asset pipeline
      # treats static files. scripts/install.sh stays the single source.
      - name: Publish install.sh alongside the docs
        run: cp scripts/install.sh docs/dist/public/install.sh

      # Pages artifact action expects the path to the built site root.
      # `actions/upload-pages-artifact` tars + uploads in one step.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist/public

  # ── Deploy to GitHub Pages (push to main only) ──────────────────────────
  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy to the Pages site
      id-token: write # OIDC token for actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
