name: Test Python

on:
  workflow_call:

jobs:
  test:
    name: "Python ${{ matrix.python }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Sync test dependencies
        run: uv sync --locked --group test

      - name: Run tests
        run: uv run pytest -v
