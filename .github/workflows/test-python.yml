name: Test Python

on:
  workflow_call:

jobs:
  test:
    name: "Python ${{ matrix.python }} (${{ matrix.deps }})"
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.deps == 'pre' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.12", deps: stable }
          - { python: "3.13", deps: stable }
          - { python: "3.13", deps: pre }

    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Sync test dependencies
        run: uv sync --locked --group test
        env:
          UV_PRERELEASE: ${{ matrix.deps == 'pre' && 'allow' || 'if-necessary-or-explicit' }}

      - name: Run tests
        run: uv run pytest -v
        env:
          UV_PRERELEASE: ${{ matrix.deps == 'pre' && 'allow' || 'if-necessary-or-explicit' }}
