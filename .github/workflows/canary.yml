name: Canary

# Builds the bleeding-edge `ndea` binary on every push to main and uploads it
# to a single rolling GitHub Release tagged `canary`. Users opt in via
# `NDEA_CHANNEL=canary curl ... | sh` (first install) or `ndea update --channel
# canary` (in-place upgrade). Mirrors Bun's `bun upgrade --canary` model.
#
# The canary release is a pre-release and never marked latest, so it does not
# affect users on `stable`.

on:
  push:
    branches: [main]
  workflow_dispatch: # manual re-run

concurrency:
  group: canary
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Build single binary per platform ─────────────────────────────────────
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: bun-darwin-arm64
            artifact: ndea-darwin-arm64
            dylib: libduckdb-bun-darwin-arm64.dylib
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: ndea-linux-x64
            dylib: libduckdb-bun-linux-x64.so
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            artifact: ndea-linux-arm64
            dylib: libduckdb-bun-linux-arm64.so

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # `no-cache: true` — canary builds publish artifacts that users
      # download via `ndea update --channel canary`. Skipping the bun
      # install cache keeps the build pipeline immune to cache poisoning
      # by an earlier PR (zizmor `cache-poisoning` audit).
      - uses: oven-sh/setup-bun@v2
        with:
          no-cache: true

      - uses: voidzero-dev/setup-vp@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stamp canary version
        run: bash .github/scripts/stamp-canary-version.sh

      - name: Build frontend
        run: vp build

      - name: Compile binary
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: bash .github/scripts/build-binary.sh

      # In-tree launch check. macOS resolves libduckdb via the
      # @executable_path rpath patched into duckdb.node at build time;
      # Linux needs LD_LIBRARY_PATH because there's no $ORIGIN-relative
      # search path for the .node (bun extracts it to /tmp at runtime).
      # Setting LD_LIBRARY_PATH unconditionally is harmless on macOS
      # (dyld ignores it).
      - name: Verify binary launches (in-tree)
        run: LD_LIBRARY_PATH="$PWD/dist" ./dist/${{ matrix.artifact }} --version

      - name: Verify isolated dir (catches missing-dylib regressions)
        env:
          ARTIFACT: ${{ matrix.artifact }}
          DYLIB: ${{ matrix.dylib }}
        run: bash .github/scripts/verify-isolated.sh

      - name: Per-artifact SHA256 checksum (binary + dylib)
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: bash .github/scripts/sha256-artifact.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}*
            dist/${{ matrix.dylib }}*
          retention-days: 1
          if-no-files-found: error

  # ── Replace the rolling `canary` release with new artifacts ─────────────
  publish:
    name: Publish canary release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Needed for `gh release` to know the repo. The token is consumed
      # via env: GH_TOKEN (not via .git/config), so we drop persistence.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Combined SHA256SUMS manifest
        run: bash .github/scripts/sha256sums-combined.sh

      - name: Replace canary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-canary-release.sh
