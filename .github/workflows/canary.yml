name: Canary

# Builds the bleeding-edge `ndea` binary on every push to main and uploads it
# to a single rolling GitHub Release tagged `canary`. Users opt in via
# `NDEA_CHANNEL=canary curl ... | sh` (first install) or `ndea update --channel
# canary` (in-place upgrade). Mirrors Bun's `bun upgrade --canary` model.
#
# The canary release is a pre-release and never marked latest, so it does not
# affect users on `stable`.

on:
  push:
    branches: [main]
  workflow_dispatch: # manual re-run

concurrency:
  group: canary
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Build single binary per platform ─────────────────────────────────────
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: bun-darwin-arm64
            artifact: ndea-darwin-arm64
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: ndea-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      # actions/checkout@v5.0.1
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      # oven-sh/setup-bun@v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      # voidzero-dev/setup-vp@v1.6.0
      - uses: voidzero-dev/setup-vp@5d8e103d67a13d69a309cd1088630ecabf823ac1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Inject commit SHA into version so each canary build has a unique
      # version string (otherwise `ndea update --channel canary` would think
      # it's already current). Mirrors Bun's `1.3.13-canary.20240101+abc1234`
      # convention — version stays semver-compatible.
      - name: Stamp canary version
        shell: bash
        run: |
          set -euo pipefail
          short_sha=$(git rev-parse --short HEAD)
          pkg_version=$(node -p "require('./package.json').version")
          canary_version="${pkg_version}-canary.${short_sha}"
          printf 'export const VERSION = %s;\n' "\"${canary_version}\"" \
            > src/cli/version.ts
          echo "Built canary version: ${canary_version}"

      - name: Build frontend
        run: vp build

      - name: Compile binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          FRONTEND_FILES=$(find dist/frontend -type f | sort)
          # shellcheck disable=SC2086
          bun build ./src/cli/index.ts \
            --compile \
            --bytecode \
            --minify \
            --target=${{ matrix.target }} \
            --outfile dist/${{ matrix.artifact }} \
            $FRONTEND_FILES

      - name: Smoke test
        run: ./dist/${{ matrix.artifact }} --version

      - name: Per-artifact SHA256 checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          fi

      # actions/upload-artifact@v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}*
          retention-days: 1
          if-no-files-found: error

  # ── Replace the rolling `canary` release with new artifacts ─────────────
  publish:
    name: Publish canary release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # actions/checkout@v5.0.1 — needed for `gh release` to know the repo
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      # actions/download-artifact@v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true

      - name: Combined SHA256SUMS manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 ndea-* | grep -v '\.sha256$' > SHA256SUMS

      # Atomically replace the canary release: delete + recreate so old
      # assets don't linger. `--cleanup-tag` removes the underlying git tag
      # too, then `create` recreates it pointing at the freshly-pushed sha.
      - name: Replace canary release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha=$(git rev-parse --short HEAD)
          gh release delete canary --yes --cleanup-tag 2>/dev/null || true
          gh release create canary \
            --target "$GITHUB_SHA" \
            --title "Canary (build ${short_sha})" \
            --prerelease \
            --notes "$(cat <<EOF
          Bleeding-edge build from \`main\` at ${short_sha}.

          ## Install

          \`\`\`bash
          NDEA_CHANNEL=canary curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | sh
          \`\`\`

          ## Upgrade in place

          \`\`\`bash
          ndea update --channel canary
          \`\`\`

          ## Roll back

          \`\`\`bash
          ndea rollback
          \`\`\`

          > Canary builds are unsigned and rebuilt on every push to \`main\`.
          > Expect breakage; report issues at https://github.com/${{ github.repository }}/issues.
          EOF
          )" \
            dist/*
