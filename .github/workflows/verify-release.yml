name: Verify release

# Fires after release.yml publishes a release. Exercises the full
# user-facing path against the real release artifacts: install.sh
# (downloaded from the release URL, not the working tree), version
# check, doctor diagnostics, symlink integrity, NDEA_DISABLE_UPDATES
# gate, gc no-op. The only thing that proves a freshly-cut release
# is actually installable + the lifecycle commands work end-to-end.
#
# Pattern: mise's `scripts/test-standalone.sh` (real release endpoint),
# scoped to ndea's actual subcommands.
#
# Triggers:
#   - workflow_run on Release: release.yml uses GITHUB_TOKEN to publish,
#     and GitHub deliberately does NOT chain follow-up workflows from
#     token-issued events (recursion guard). The `release:` event below
#     is a no-op for token-published releases. workflow_run is the
#     supported escape hatch — it fires on the parent workflow's
#     completion regardless of how the parent was triggered.
#   - release: kept for releases authored by a human / PAT (GitHub Apps)
#     so manual edits or out-of-band publishes still get verified.
#   - workflow_dispatch: manual fallback with a tag override.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  release:
    types: [published, prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify (default = latest release)
        required: false

permissions: {}

concurrency:
  group: verify-release-${{ github.event.release.tag_name || github.event.workflow_run.head_branch || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify ${{ matrix.label }}
    # When chained from release.yml via workflow_run, only run on a
    # successful parent run. Other trigger types always run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-14 (darwin-arm64)
            runner: macos-14
          - label: ubuntu-latest (linux-x64)
            runner: ubuntu-latest
          - label: ubuntu-24.04-arm (linux-arm64)
            runner: ubuntu-24.04-arm

    steps:
      # Hoist event-derived inputs into env vars so zizmor's
      # template-injection audit doesn't flag inline `${{ … }}` expansions
      # in the `run:` body. Same data, safer interpolation path.
      #
      # Tag resolution priority:
      #   1. release.tag_name           (release event)
      #   2. workflow_run.head_branch   (chained from release.yml — head_branch
      #                                  carries the tag ref for tag-triggered runs)
      #   3. inputs.tag                 (manual workflow_dispatch override)
      #   4. /releases/latest API       (last-resort fallback)
      - name: Resolve tag
        id: tag
        env:
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          WORKFLOW_RUN_REF: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          tag="${RELEASE_TAG_NAME:-${WORKFLOW_RUN_REF:-$INPUT_TAG}}"
          if [ -z "$tag" ]; then
            tag=$(curl -fsSL --proto '=https' --tlsv1.2 \
              "https://api.github.com/repos/${REPO}/releases/latest" \
              | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -n 1)
          fi
          # Sanity guard: workflow_run on a non-tag push (e.g. a manual
          # release.yml dispatch on main) would surface a branch name
          # here. Bail out with a clear error so we don't try to download
          # nonsense tags.
          case "$tag" in
            v*) ;;
            *) echo "::error::resolved tag '$tag' does not look like a release tag (must start with 'v')"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $tag"

      - name: Install via per-tag install.sh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          NDEA_BIN_DIR: ${{ runner.temp }}/bin
          NDEA_HOME: ${{ runner.temp }}/state
          NDEA_VERSION: ${{ steps.tag.outputs.tag }}
          # Private repo — fetch install.sh + binaries via authenticated
          # API. NDEA_GITHUB_TOKEN flows into install.sh; GH_TOKEN is for
          # the gh-cli call that downloads install.sh itself.
          NDEA_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$(dirname "$0")"
          gh release download "$TAG" -R ${{ github.repository }} -p install.sh -O /tmp/install.sh
          sh /tmp/install.sh

      - name: Verify symlink layout + sidecar presence
        env:
          NDEA_BIN_DIR: ${{ runner.temp }}/bin
          NDEA_HOME: ${{ runner.temp }}/state
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          test -L "$NDEA_BIN_DIR/ndea" || { echo "::error::ndea is not a symlink"; exit 1; }
          target=$(readlink "$NDEA_BIN_DIR/ndea")
          echo "symlink → $target"
          # Symlink targets the wrapper script, NOT the binary directly.
          case "$target" in
            *"versions/${TAG}/ndea") echo "ok: points at versions/${TAG}/ndea (wrapper)";;
            *) echo "::error::symlink target unexpected: $target"; exit 1;;
          esac

          version_dir="$NDEA_HOME/versions/${TAG}"
          test -x "$version_dir/ndea"     || { echo "::error::wrapper missing or not executable"; exit 1; }
          test -x "$version_dir/ndea.bin" || { echo "::error::ndea.bin missing or not executable"; exit 1; }
          ext=so; case "$RUNNER_OS" in macOS) ext=dylib ;; esac
          test -f "$version_dir/libduckdb.$ext" || {
            echo "::error::missing libduckdb.$ext sidecar"
            ls -la "$version_dir"
            exit 1
          }
          echo "ok: $version_dir contains ndea (wrapper), ndea.bin, libduckdb.$ext"

      - name: ndea --version
        env:
          NDEA_BIN_DIR: ${{ runner.temp }}/bin
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          out=$("$NDEA_BIN_DIR/ndea" --version)
          echo "$out"
          # Tag has a leading 'v'; binary reports the bare semver.
          expected="${TAG#v}"
          echo "$out" | grep -q "$expected" \
            || { echo "::error::version output missing $expected"; exit 1; }

      - name: ndea doctor
        env:
          NDEA_BIN_DIR: ${{ runner.temp }}/bin
          NDEA_HOME: ${{ runner.temp }}/state
        run: |
          "$NDEA_BIN_DIR/ndea" doctor

      - name: NDEA_DISABLE_UPDATES gate
        env:
          NDEA_BIN_DIR: ${{ runner.temp }}/bin
          NDEA_HOME: ${{ runner.temp }}/state
          NDEA_DISABLE_UPDATES: "1"
        run: |
          if "$NDEA_BIN_DIR/ndea" update; then
            echo "::error::ndea update should have exited non-zero under NDEA_DISABLE_UPDATES=1"
            exit 1
          fi
          echo "ok: update blocked"

      - name: ndea gc --keep 1 (no-op with one version)
        env:
          NDEA_BIN_DIR: ${{ runner.temp }}/bin
          NDEA_HOME: ${{ runner.temp }}/state
        run: |
          "$NDEA_BIN_DIR/ndea" gc --keep 1
