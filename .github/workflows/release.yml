name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Build single binary per platform ─────────────────────────────────────
  # Each platform builds natively so duckdb.node is included correctly.
  # Cross-compilation (--target=bun-X-Y) cannot embed native N-API addons.

  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            target: bun-darwin-arm64
            artifact: ndea-darwin-arm64
          - os: macos-13 # Intel Mac
            target: bun-darwin-x64
            artifact: ndea-darwin-x64
          - os: ubuntu-latest # Linux x64
            target: bun-linux-x64
            artifact: ndea-linux-x64
          - os: ubuntu-24.04-arm # Linux arm64 (Graviton, RPi5)
            target: bun-linux-arm64
            artifact: ndea-linux-arm64
          - os: windows-latest # Windows x64
            target: bun-windows-x64
            artifact: ndea-windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      # actions/checkout@v5.0.1
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      # Fail loudly if the pushed tag does not match package.json version.
      # Guards against "tag pushed without running scripts/sync-version.ts".
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          set -euo pipefail
          tag=$(git describe --tags --exact-match)
          pkg_version=$(node -p "require('./package.json').version")
          expected="v${pkg_version}"
          if [ "$tag" != "$expected" ]; then
            echo "::error::Tag ($tag) does not match package.json version ($expected)"
            echo "Run 'bun run scripts/sync-version.ts' + commit before tagging."
            exit 1
          fi
          echo "Tag $tag matches package.json $expected"

      # oven-sh/setup-bun@v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      # voidzero-dev/setup-vp@v1.6.0
      - uses: voidzero-dev/setup-vp@5d8e103d67a13d69a309cd1088630ecabf823ac1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: vp build

      - name: Compile binary (native — duckdb.node embeds here)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Enumerate frontend assets for embedding in the single-file binary
          FRONTEND_FILES=$(find dist/frontend -type f | sort)
          # shellcheck disable=SC2086
          bun build ./src/cli/index.ts \
            --compile \
            --bytecode \
            --minify \
            --target=${{ matrix.target }} \
            --outfile dist/${{ matrix.artifact }} \
            $FRONTEND_FILES

      - name: Smoke test
        if: runner.os != 'Windows'
        run: ./dist/${{ matrix.artifact }} --version

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\dist\${{ matrix.artifact }} --version

      - name: Report binary size
        shell: bash
        run: ls -lh dist/${{ matrix.artifact }}

      - name: Per-artifact SHA256 checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          fi
          cat "${{ matrix.artifact }}.sha256"

      # actions/upload-artifact@v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}*
          retention-days: 7
          if-no-files-found: error

  # ── Publish GitHub Release with all binaries + combined manifest ────────
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # actions/download-artifact@v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true

      - name: Combined SHA256SUMS manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -lh
          # Exclude per-artifact *.sha256 files from the combined manifest
          shasum -a 256 ndea-* | grep -v '\.sha256$' > SHA256SUMS
          echo "---"
          cat SHA256SUMS

      # softprops/action-gh-release@v2.6.2
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Install

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/scripts/install.sh | sh
            ```

            Or download a binary directly from the asset list below and verify
            against `SHA256SUMS`:

            ```bash
            shasum -a 256 -c SHA256SUMS --ignore-missing
            ```

            > macOS users: unsigned binaries may be blocked by Gatekeeper. Run
            > `xattr -dr com.apple.quarantine ./ndea` after download.
