name: Release

# Cut a release by publishing one from the GitHub Releases UI: enter the tag,
# tick pre-release (or not), Publish. `published` is the only activity type
# that fires for both stable and pre-releases (incl. those published from a
# draft). It fires for a human in the UI but NOT for a release created by the
# Actions GITHUB_TOKEN — so no PAT is needed and there's no self-trigger loop.
on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Build single binary per platform ─────────────────────────────────────
  # Each platform builds natively so duckdb.node is included correctly.
  # Cross-compilation (--target=bun-X-Y) cannot embed native N-API addons.

  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            target: bun-darwin-arm64
            artifact: ndea-darwin-arm64
          - os: ubuntu-latest # Linux x64
            target: bun-linux-x64
            artifact: ndea-linux-x64
          - os: ubuntu-24.04-arm # Linux ARM64 (native, no QEMU)
            target: bun-linux-arm64
            artifact: ndea-linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          # Build the exact commit the release tag points to (the UI lets the
          # author target any commit), not whatever branch HEAD is.
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      # `no-cache: true` — release builds run on release publish and must not load
      # a `~/.bun/install/cache` populated by an earlier PR. Mitigates the
      # zizmor `cache-poisoning` audit; release infra is infrequent so the
      # extra ~10s per platform is acceptable.
      - uses: oven-sh/setup-bun@v2
        with:
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The git tag is the single source of truth for the version: stamp it
      # into src/cli/version.ts before compiling. sync-version's semver check
      # fails the build on a mistyped tag (replaces the old tag==package.json
      # guard). No package.json bump, no commit-back.
      # Pass the tag through env (not inline ${{ }} in run) — git tag names can
      # contain shell metacharacters; this avoids a template-injection surface
      # and matches the env-var pattern used elsewhere in this workflow.
      - name: Stamp version from release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bun run scripts/sync-version.ts "$RELEASE_TAG"

      - name: Compile single-file binary (libduckdb embedded)
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: bash .github/scripts/build-binary.sh

      - name: Verify binary launches
        run: ./dist/${{ matrix.artifact }} --version

      - name: Report binary size
        shell: bash
        run: ls -lh dist/${{ matrix.artifact }}

      - name: Per-artifact SHA256 checksum
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: bash .github/scripts/sha256-artifact.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}*
          retention-days: 7
          if-no-files-found: error

  # ── Publish GitHub Release with all binaries + combined manifest ────────
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Needed for the SHA256SUMS helper script under .github/scripts/.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Combined SHA256SUMS manifest
        run: bash .github/scripts/sha256sums-combined.sh

      # Bundle install.sh as a release asset so users can pin the
      # installer URL to a specific tag — `curl …/v0.X.Y/install.sh | sh`
      # gets the install script frozen at this release. The canonical
      # `…/main/install.sh` always reflects the latest code on main.
      - name: Bundle install.sh as a release asset
        run: cp scripts/install.sh dist/install.sh

      # The release already exists (published from the UI). action-gh-release
      # updates that existing release, attaching the binaries + SHA256SUMS +
      # install.sh. Channel + "Latest" badge mirror the author's pre-release
      # checkbox (github.event.release.prerelease) — CI echoes the UI choice,
      # never overrides it. append_body keeps whatever notes the author typed
      # in the UI (or generate_release_notes produced) and appends the install
      # instructions below, rather than replacing them.
      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          append_body: true
          fail_on_unmatched_files: true
          prerelease: ${{ github.event.release.prerelease }}
          make_latest: ${{ !github.event.release.prerelease }}
          body: |
            ## Install

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.release.tag_name }}/scripts/install.sh | sh
            ```

            Or download a binary directly from the asset list below and verify
            against `SHA256SUMS`:

            ```bash
            shasum -a 256 -c SHA256SUMS --ignore-missing
            ```

            > macOS users: unsigned binaries may be blocked by Gatekeeper. Run
            > `xattr -dr com.apple.quarantine ./ndea` after download.

  # ── Bump manifest.json["pre-release"] on a pre-release ───────────────────
  # When the author ticks "pre-release" in the UI, move the pre-release
  # channel pointer; stable cuts leave it alone. Automating the pointer bump
  # avoids the "I forgot to update the manifest" footgun.
  #
  # Opens a PR rather than pushing directly so a human reviews + merges — a
  # deliberate one-click gate: publishing the release makes binaries available,
  # but merging this is what flips `ndea update --channel pre-release` to the
  # new tag. Auditable in PR history; a bad pre-release can be vetoed first.
  bump-prerelease-manifest:
    name: Open manifest.pre-release bump PR
    needs: publish
    if: ${{ github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Fetch main (not the tag) to base the PR on. peter-evans receives
      # the token via its `token` input (defaults to `${{ github.token }}`)
      # rather than via .git/config, so we drop persist-credentials.
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      # Inlined jq update — script lives on the rewrite branch but the
      # checkout above pulls main, where the file doesn't exist yet.
      # Skip gracefully if manifest.json isn't on main yet (pre-rewrite-merge
      # state); once the rewrite lands on main, this runs normally.
      - name: Update manifest.json["pre-release"]
        id: bump
        env:
          NEW_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ ! -f manifest.json ]; then
            echo "::warning::manifest.json not on main yet — skipping pre-release pointer bump"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tmp=$(mktemp)
          jq --arg tag "${NEW_TAG}" '.channels."pre-release" = $tag' manifest.json > "${tmp}"
          mv "${tmp}" manifest.json
          echo "Updated manifest.json:"
          cat manifest.json
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      # Opens (or updates) a PR against main with the manifest change.
      # Idempotent: re-running on an already-bumped manifest is a no-op.
      - name: Open / update bump PR
        if: steps.bump.outputs.skipped != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/manifest-prerelease-bump
          base: main
          delete-branch: true
          commit-message: "chore(manifest): bump pre-release → ${{ github.event.release.tag_name }}"
          title: "chore(manifest): bump pre-release → ${{ github.event.release.tag_name }}"
          body: |
            Automated by `release.yml` after publishing
            [`${{ github.event.release.tag_name }}`](https://github.com/${{ github.repository }}/releases/tag/${{ github.event.release.tag_name }}).

            Once merged, `ndea update --channel pre-release` will resolve
            to this tag.

            Reviewers: confirm this is the intended `pre-release` channel
            pointer before merging. To skip activating it (e.g. because
            it superseded an earlier pre-release and you want users on
            the older one), close this PR without merging.
          labels: |
            release
            automated
