name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ── Build single binary per platform ─────────────────────────────────────
  # Each platform builds natively so duckdb.node is included correctly.
  # Cross-compilation cannot include native N-API addons.

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14           # Apple Silicon
            target: bun-darwin-arm64
            artifact: ndea-darwin-arm64
          - os: macos-13           # Intel Mac
            target: bun-darwin-x64
            artifact: ndea-darwin-x64
          - os: ubuntu-latest      # Linux x64
            target: bun-linux-x64
            artifact: ndea-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Install frontend dependencies
        run: cd frontend && bun install

      - name: Build frontend
        run: cd frontend && vp build

      - name: Compile binary
        run: |
          mkdir -p dist

          # Enumerate frontend assets for embedding
          FRONTEND_FILES=$(find frontend/dist -type f | sort)

          # shellcheck disable=SC2086
          bun build ./src/cli/index.ts \
            --compile \
            --target=${{ matrix.target }} \
            --outfile dist/${{ matrix.artifact }} \
            --bytecode \
            --minify \
            $FRONTEND_FILES

      - name: Smoke test (native builds only)
        if: matrix.target == format('bun-{0}-{1}', runner.os == 'macOS' && 'darwin' || 'linux', runner.arch == 'ARM64' && 'arm64' || 'x64')
        run: |
          ./dist/${{ matrix.artifact }} --version
          ./dist/${{ matrix.artifact }} --help

      - name: Report binary size
        run: ls -lh dist/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 7

  # ── Create GitHub Release with all binaries ──────────────────────────────

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in artifacts/ndea-*; do
            name=$(basename "$dir")
            cp "$dir/$name" "release/$name"
            chmod +x "release/$name"
          done
          ls -lh release/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: false
