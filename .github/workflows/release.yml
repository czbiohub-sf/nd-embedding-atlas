name: Release

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # required to upload assets to the release

jobs:
  # Build and validate the frontend, producing the frontend-dist artifact
  frontend:
    uses: ./.github/workflows/build-frontend.yml

  # Build the wheel
  build:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: frontend

    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          fetch-depth: 0  # uv-dynamic-versioning reads git tags

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build wheel
        run: uv build --wheel
        env:
          HATCH_BUILD_HOOKS_ENABLE: "true"

      - name: Check wheel metadata
        run: uvx twine check --strict dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Upload wheel to the already-created GitHub Release
  publish:
    name: Upload to GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload wheel assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Copy wheel to stable name for fixed-URL installs:
          # https://github.com/czbiohub-sf/nd-embedding-atlas/releases/latest/download/ndea-latest.whl
          cp dist/*.whl dist/ndea-latest.whl
          gh release upload "${{ github.event.release.tag_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --clobber

  # Uncomment to publish to PyPI when ready (configure trusted publishing at
  # pypi.org/manage/project/nd-embedding-atlas/settings/publishing/ first)
