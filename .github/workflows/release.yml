name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Build single binary per platform ─────────────────────────────────────
  # Each platform builds natively so duckdb.node is included correctly.
  # Cross-compilation (--target=bun-X-Y) cannot embed native N-API addons.

  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            target: bun-darwin-arm64
            artifact: ndea-darwin-arm64
          - os: ubuntu-latest # Linux x64
            target: bun-linux-x64
            artifact: ndea-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Fail loudly if the pushed tag does not match package.json version.
      # Guards against "tag pushed without running scripts/sync-version.ts".
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          set -euo pipefail
          tag=$(git describe --tags --exact-match)
          pkg_version=$(node -p "require('./package.json').version")
          expected="v${pkg_version}"
          if [ "$tag" != "$expected" ]; then
            echo "::error::Tag ($tag) does not match package.json version ($expected)"
            echo "Run 'bun run scripts/sync-version.ts' + commit before tagging."
            exit 1
          fi
          echo "Tag $tag matches package.json $expected"

      # `no-cache: true` — release builds run on tag push and must not load
      # a `~/.bun/install/cache` populated by an earlier PR. Mitigates the
      # zizmor `cache-poisoning` audit; release infra is infrequent so the
      # extra ~10s per platform is acceptable.
      - uses: oven-sh/setup-bun@v2
        with:
          no-cache: true

      - uses: voidzero-dev/setup-vp@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: vp build

      - name: Compile binary (native — duckdb.node embeds here)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Enumerate frontend assets for embedding in the single-file binary
          FRONTEND_FILES=$(find dist/frontend -type f | sort)
          # shellcheck disable=SC2086
          bun build ./src/cli/index.ts \
            --compile \
            --bytecode \
            --minify \
            --target=${{ matrix.target }} \
            --outfile dist/${{ matrix.artifact }} \
            $FRONTEND_FILES

      - name: Smoke test
        run: ./dist/${{ matrix.artifact }} --version

      - name: Report binary size
        shell: bash
        run: ls -lh dist/${{ matrix.artifact }}

      - name: Per-artifact SHA256 checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          fi
          cat "${{ matrix.artifact }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}*
          retention-days: 7
          if-no-files-found: error

  # ── Publish GitHub Release with all binaries + combined manifest ────────
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Combined SHA256SUMS manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -lh
          # Exclude per-artifact *.sha256 files from the combined manifest
          shasum -a 256 ndea-* | grep -v '\.sha256$' > SHA256SUMS
          echo "---"
          cat SHA256SUMS

      # Tag-pattern auto-classification: semver pre-release identifiers are
      # always preceded by a `-` (e.g. v0.1.0-rc.1, v0.1.0-beta.2,
      # v0.1.0-alpha.5). Stable tags never contain `-`. So a single contains()
      # check correctly routes `prerelease` and `make_latest`:
      #   v0.1.0       → release, marked latest
      #   v0.1.0-rc.1  → pre-release, NOT marked latest
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body: |
            ## Install

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/scripts/install.sh | sh
            ```

            Or download a binary directly from the asset list below and verify
            against `SHA256SUMS`:

            ```bash
            shasum -a 256 -c SHA256SUMS --ignore-missing
            ```

            > macOS users: unsigned binaries may be blocked by Gatekeeper. Run
            > `xattr -dr com.apple.quarantine ./ndea` after download.

  # ── Bump manifest.json["rc"] when an *-rc.* tag is published ──────────────
  # Stable / beta / alpha cuts are hand-edited in manifest.json by ops.
  # RC cuts happen often enough during stabilisation that automating the
  # pointer bump avoids the "I forgot to update the manifest" footgun.
  #
  # Opens a PR rather than pushing directly so a human reviews + merges.
  # Keeps `main` honest: every change to the canonical manifest is
  # auditable in PR history, and a bad RC can be vetoed before users see
  # `ndea update --channel rc` resolve to it.
  bump-rc-manifest:
    name: Open manifest.rc bump PR
    needs: publish
    if: contains(github.ref_name, '-rc.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Fetch main (not the tag) to base the PR on. peter-evans receives
      # the token via its `token` input (defaults to `${{ github.token }}`)
      # rather than via .git/config, so we drop persist-credentials.
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Update manifest.json["rc"]
        shell: bash
        env:
          NEW_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # jq is preinstalled on ubuntu-latest runners.
          tmp=$(mktemp)
          jq --arg tag "$NEW_TAG" '.channels.rc = $tag' manifest.json > "$tmp"
          mv "$tmp" manifest.json
          echo "Updated manifest.json:"
          cat manifest.json

      # Opens (or updates) a PR against main with the manifest change.
      # Idempotent: re-running on an already-bumped manifest is a no-op.
      - name: Open / update bump PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/manifest-rc-bump
          base: main
          delete-branch: true
          commit-message: "chore(manifest): bump rc → ${{ github.ref_name }}"
          title: "chore(manifest): bump rc → ${{ github.ref_name }}"
          body: |
            Automated by `release.yml` after publishing
            [`${{ github.ref_name }}`](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}).

            Once merged, `ndea update --channel rc` will resolve to this tag.

            Reviewers: confirm the RC is the intended `rc` channel pointer
            before merging. To skip activating this RC (e.g. because it
            superseded an earlier RC and you want users on the older one),
            close this PR without merging.
          labels: |
            release
            automated
