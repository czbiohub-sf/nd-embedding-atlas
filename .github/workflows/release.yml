name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Build single binary per platform ─────────────────────────────────────
  # Each platform builds natively so duckdb.node is included correctly.
  # Cross-compilation (--target=bun-X-Y) cannot embed native N-API addons.

  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            target: bun-darwin-arm64
            artifact: ndea-darwin-arm64
          - os: ubuntu-latest # Linux x64
            target: bun-linux-x64
            artifact: ndea-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify tag matches package.json version
        run: bash .github/scripts/verify-tag-version.sh

      # `no-cache: true` — release builds run on tag push and must not load
      # a `~/.bun/install/cache` populated by an earlier PR. Mitigates the
      # zizmor `cache-poisoning` audit; release infra is infrequent so the
      # extra ~10s per platform is acceptable.
      - uses: oven-sh/setup-bun@v2
        with:
          no-cache: true

      - uses: voidzero-dev/setup-vp@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: vp build

      - name: Compile binary (native — duckdb.node embeds here)
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: bash .github/scripts/build-binary.sh

      - name: Smoke test
        run: ./dist/${{ matrix.artifact }} --version

      - name: Report binary size
        shell: bash
        run: ls -lh dist/${{ matrix.artifact }}

      - name: Per-artifact SHA256 checksum
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: bash .github/scripts/sha256-artifact.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}*
          retention-days: 7
          if-no-files-found: error

  # ── Publish GitHub Release with all binaries + combined manifest ────────
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Needed for the SHA256SUMS helper script under .github/scripts/.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Combined SHA256SUMS manifest
        run: bash .github/scripts/sha256sums-combined.sh

      # Bundle install.sh as a release asset so users can pin the
      # installer URL to a specific tag — `curl …/v0.X.Y/install.sh | sh`
      # gets the install script frozen at this release. The canonical
      # `…/main/install.sh` always reflects the latest code on main.
      - name: Bundle install.sh as a release asset
        run: cp scripts/install.sh dist/install.sh

      # Tag-pattern auto-classification: semver pre-release identifiers are
      # always preceded by a `-` (e.g. v0.1.0-rc.1, v0.1.0-beta.2,
      # v0.1.0-alpha.5). Stable tags never contain `-`. So a single contains()
      # check correctly routes `prerelease` and `make_latest`:
      #   v0.1.0       → release, marked latest
      #   v0.1.0-rc.1  → pre-release, NOT marked latest
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body: |
            ## Install

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/scripts/install.sh | sh
            ```

            Or download a binary directly from the asset list below and verify
            against `SHA256SUMS`:

            ```bash
            shasum -a 256 -c SHA256SUMS --ignore-missing
            ```

            > macOS users: unsigned binaries may be blocked by Gatekeeper. Run
            > `xattr -dr com.apple.quarantine ./ndea` after download.

  # ── Bump manifest.json["pre-release"] on any pre-release tag ─────────────
  # Pre-release tags (any tag containing `-`, e.g. v0.1.0-alpha.1,
  # v0.1.0-beta.2, v0.1.0-rc.1) move the pointer; stable cuts leave it
  # alone. Automating the pointer bump avoids the "I forgot to update
  # the manifest" footgun during the stabilisation cycle.
  #
  # Opens a PR rather than pushing directly so a human reviews + merges.
  # Keeps `main` honest: every change to the canonical manifest is
  # auditable in PR history, and a bad pre-release can be vetoed before
  # users see `ndea update --channel pre-release` resolve to it.
  bump-prerelease-manifest:
    name: Open manifest.pre-release bump PR
    needs: publish
    if: contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Fetch main (not the tag) to base the PR on. peter-evans receives
      # the token via its `token` input (defaults to `${{ github.token }}`)
      # rather than via .git/config, so we drop persist-credentials.
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      # Inlined jq update — script lives on the rewrite branch but the
      # checkout above pulls main, where the file doesn't exist yet.
      # Skip gracefully if manifest.json isn't on main yet (pre-rewrite-merge
      # state); once the rewrite lands on main, this runs normally.
      - name: Update manifest.json["pre-release"]
        id: bump
        env:
          NEW_TAG: ${{ github.ref_name }}
        run: |
          if [ ! -f manifest.json ]; then
            echo "::warning::manifest.json not on main yet — skipping pre-release pointer bump"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tmp=$(mktemp)
          jq --arg tag "${NEW_TAG}" '.channels."pre-release" = $tag' manifest.json > "${tmp}"
          mv "${tmp}" manifest.json
          echo "Updated manifest.json:"
          cat manifest.json
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      # Opens (or updates) a PR against main with the manifest change.
      # Idempotent: re-running on an already-bumped manifest is a no-op.
      - name: Open / update bump PR
        if: steps.bump.outputs.skipped != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/manifest-prerelease-bump
          base: main
          delete-branch: true
          commit-message: "chore(manifest): bump pre-release → ${{ github.ref_name }}"
          title: "chore(manifest): bump pre-release → ${{ github.ref_name }}"
          body: |
            Automated by `release.yml` after publishing
            [`${{ github.ref_name }}`](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}).

            Once merged, `ndea update --channel pre-release` will resolve
            to this tag.

            Reviewers: confirm this is the intended `pre-release` channel
            pointer before merging. To skip activating it (e.g. because
            it superseded an earlier pre-release and you want users on
            the older one), close this PR without merging.
          labels: |
            release
            automated
