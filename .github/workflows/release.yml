name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Build single binary per platform ─────────────────────────────────────
  # Each platform builds natively so duckdb.node is included correctly.
  # Cross-compilation (--target=bun-X-Y) cannot embed native N-API addons.

  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            target: bun-darwin-arm64
            artifact: ndea-darwin-arm64
          - os: ubuntu-latest # Linux x64
            target: bun-linux-x64
            artifact: ndea-linux-x64
          - os: ubuntu-24.04-arm # Linux ARM64 (native, no QEMU)
            target: bun-linux-arm64
            artifact: ndea-linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # `no-cache: true`: release builds run on tag push and must not load
      # a `~/.bun/install/cache` populated by an earlier PR. Mitigates the
      # zizmor `cache-poisoning` audit; release infra is infrequent so the
      # extra ~10s per platform is acceptable.
      - uses: oven-sh/setup-bun@v2
        with:
          no-cache: true
      - uses: voidzero-dev/setup-vp@v1

      - name: Verify tag matches package.json version
        run: bash .github/scripts/verify-tag-version.sh

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Compile single-file binary (libduckdb embedded)
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: bash .github/scripts/build-binary.sh

      - name: Verify binary version
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: bash .github/scripts/verify-binary-version.sh

      - name: Verify isolated dir (no siblings)
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: bash .github/scripts/verify-isolated.sh

      - name: Report binary size
        shell: bash
        run: ls -lh dist/${{ matrix.artifact }}

      - name: Per-artifact SHA256 checksum
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: bash .github/scripts/sha256-artifact.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}*
          retention-days: 7
          if-no-files-found: error

  # ── Publish GitHub Release with all binaries + combined manifest ────────
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Needed for the SHA256SUMS helper script under .github/scripts/.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Combined SHA256SUMS manifest
        run: bash .github/scripts/sha256sums-combined.sh

      # Bundle install.sh as a release asset so users can pin the
      # installer URL to a specific tag; `curl …/v0.X.Y/install.sh | sh`
      # gets the install script frozen at this release. The canonical
      # copy on the docs site always reflects the latest code on main.
      - name: Bundle install.sh as a release asset
        run: cp scripts/install.sh dist/install.sh

      # Tag-pattern auto-classification: semver pre-release identifiers are
      # always preceded by a `-` (e.g. v0.1.0-rc.1, v0.1.0-beta.2,
      # v0.1.0-alpha.5). Stable tags never contain `-`. So a single contains()
      # check correctly routes `prerelease` and `make_latest`:
      #   v0.1.0       → release, marked latest
      #   v0.1.0-rc.1  → pre-release, NOT marked latest
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body: |
            ## Install

            ```bash
            curl -fsSL https://czbiohub-sf.github.io/nd-embedding-atlas/install.sh \
              | sh -s -- ${{ github.ref_name }}
            ```

            Or download a binary directly from the asset list below and verify
            against `SHA256SUMS`:

            ```bash
            shasum -a 256 -c SHA256SUMS --ignore-missing
            ```

            > macOS users: unsigned binaries may be blocked by Gatekeeper. Run
            > `xattr -dr com.apple.quarantine ./ndea` after download.
