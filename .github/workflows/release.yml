name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # required to create GitHub Releases and upload assets

jobs:
  # Build and validate the frontend, producing the frontend-dist artifact
  frontend:
    uses: ./.github/workflows/build-frontend.yml

  # Build the wheel — hatch hook finds frontend/dist/ already present and skips rebuild
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    needs: frontend

    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          fetch-depth: 0  # uv-dynamic-versioning reads git tags

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build wheel
        run: uv build --wheel
        env:
          HATCH_BUILD_HOOKS_ENABLE: "true"

      - name: Check wheel metadata
        run: uvx twine check --strict dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Publish the wheel as a GitHub Release asset
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Copy wheel to stable name so users can always install from a fixed URL:
          # https://github.com/czbiohub-sf/nd-embedding-atlas/releases/latest/download/ndea-latest.whl
          cp dist/*.whl dist/ndea-latest.whl
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

  # Uncomment to publish to PyPI when ready (configure trusted publishing at
  # pypi.org/manage/project/nd-embedding-atlas/settings/publishing/ first)
