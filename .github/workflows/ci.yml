name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Check + test matrix (`vp run verify`) ───────────────────────────────
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is absent deliberately: the unit suite still assumes POSIX
        # symlinks, /tmp, and chmod in ~11 files. The Windows binary is
        # covered end-to-end by build-verify below.
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: voidzero-dev/setup-vp@v1
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: vp run verify
        run: vp run verify
      # install.ps1 is piped straight into `iex` by users, so a syntax error
      # is a total install failure with no partial-success mode. Parse it with
      # the real PowerShell parser (pwsh is preinstalled on ubuntu runners).
      - name: Parse-check install.ps1
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error::$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host "install.ps1 parses cleanly"

  # ── Full build + launch verify (frontend + binary, catches release-time
  # regressions at PR time rather than at release time) ─────────────────
  build-verify:
    name: Build + verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ndea
          - os: macos-14
            artifact: ndea
          - os: ubuntu-24.04-arm
            artifact: ndea
          - os: windows-latest
            artifact: ndea.exe
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: voidzero-dev/setup-vp@v1
      - name: Install dependencies
        run: vp install --frozen-lockfile
      # `vp run build` exercises the full release path: `build:addon`, then
      # Bun.build `compile` (single full-stack binary with the frontend bundle,
      # bytecode, and sourcemaps). PRs that break any of these surface here
      # instead of during a release.
      - name: vp run build
        run: vp run build
      - name: Verify binary version
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: bash .github/scripts/verify-binary-version.sh
      # Isolated-dir launch check: copy binary to a fresh dir with no
      # siblings. Catches any regression that reintroduces sibling-file
      # lookups (rpath / LD_LIBRARY_PATH).
      - name: Verify isolated dir (single-file binary)
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: bash .github/scripts/verify-isolated.sh

  # ── Single required status check for branch protection ────────────────
  all-green:
    name: All checks pass
    if: always()
    needs: [verify, build-verify]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
