name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Typecheck + lint + fmt (Linux only — deterministic, fast) ───────────
  check:
    name: Typecheck + lint + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: voidzero-dev/setup-vp@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: vp check
        run: vp check
      # Verify .bunli/commands.gen.ts is in sync with src/cli/commands/.
      # The standard verify-no-drift / gen-check pattern (Buf, sqlc,
      # Prisma, GraphQL Codegen all do this).
      - name: Verify bunli gen output is in sync
        run: bash .github/scripts/check-bunli-gen.sh

  # ── Bun test matrix ─────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: bun test
        run: bun test

  # ── Full build smoke (frontend + binary, catches release-time regressions
  # at PR time rather than at canary-on-merge time) ──────────────────────
  build-smoke:
    name: Build smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ndea-linux-x64
            dylib: libduckdb-bun-linux-x64.so
          - os: macos-14
            artifact: ndea-darwin-arm64
            dylib: libduckdb-bun-darwin-arm64.dylib
          - os: ubuntu-24.04-arm
            artifact: ndea-linux-arm64
            dylib: libduckdb-bun-linux-arm64.so
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: voidzero-dev/setup-vp@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # `bun run build` exercises the full release path: vp build (frontend)
      # → embed-asset manifest generation → bun build --compile (binary)
      # → install_name_tool rpath patch + libduckdb sidecar copy. PRs that
      # break any of these surface here instead of in canary.
      - name: bun run build
        run: bun run build
      # In-tree smoke: build.ts also drops `dist/libduckdb.<ext>` (symlink)
      # and `dist/ndea-launcher` (the wrapper) so the dev-tree layout
      # mirrors the install layout. Catches any drift between build output
      # and what install.sh / update.ts will produce in the field.
      - name: Smoke (in-tree wrapper)
        run: ./dist/ndea-launcher --version
      # Out-of-tree smoke: copy binary + sidecar to a fresh dir with no
      # node_modules. This catches the bug class the dylib-sidecar plan
      # solves — a binary whose duckdb.node can't find libduckdb at
      # runtime. Without this step the bug only shows up at install time
      # for end users.
      - name: Smoke (isolated dir — binary + sidecar only)
        env:
          ARTIFACT: ndea
          DYLIB: ${{ matrix.dylib }}
        run: |
          # build.ts emits dist/ndea (not dist/$ARTIFACT) when run locally;
          # rename so smoke-isolated.sh's lookup works without forking it.
          ARTIFACT=ndea bash .github/scripts/smoke-isolated.sh

  # ── Single required status check for branch protection ────────────────
  all-green:
    name: All checks pass
    if: always()
    needs: [check, test, build-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
