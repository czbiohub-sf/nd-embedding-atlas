name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Typecheck + lint + fmt (Linux only — deterministic, fast) ───────────
  check:
    name: Typecheck + lint + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: voidzero-dev/setup-vp@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: vp check
        run: vp check
      # Verify .bunli/commands.gen.ts is in sync with src/cli/commands/.
      # The standard verify-no-drift / gen-check pattern (Buf, sqlc,
      # Prisma, GraphQL Codegen all do this).
      - name: Verify bunli gen output is in sync
        run: bash .github/scripts/check-bunli-gen.sh

  # ── Bun test matrix ─────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: bun test
        run: bun test

  # ── Frontend build smoke (catches bundler regressions) ─────────────────
  build-smoke:
    name: Frontend build smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: voidzero-dev/setup-vp@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: vp build
        run: vp build

  # ── Single required status check for branch protection ────────────────
  all-green:
    name: All checks pass
    if: always()
    needs: [check, test, build-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
