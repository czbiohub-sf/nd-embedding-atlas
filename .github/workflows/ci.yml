name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Typecheck + lint + fmt (Linux only — deterministic, fast) ───────────
  check:
    name: Typecheck + lint + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: voidzero-dev/setup-vp@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: vp check
        run: vp check
      # Verify .bunli/commands.gen.ts is in sync with src/cli/commands/.
      # The standard verify-no-drift / gen-check pattern (Buf, sqlc,
      # Prisma, GraphQL Codegen all do this).
      - name: Verify bunli gen output is in sync
        run: bash .github/scripts/check-bunli-gen.sh

  # ── Bun test matrix ─────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: bun test
        run: bun test

  # ── Full build + launch verify (frontend + binary, catches release-time
  # regressions at PR time rather than at canary-on-merge time) ──────────
  build-verify:
    name: Build + verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ndea-linux-x64
          - os: macos-14
            artifact: ndea-darwin-arm64
          - os: ubuntu-24.04-arm
            artifact: ndea-linux-arm64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: voidzero-dev/setup-vp@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # `bun run build` exercises the full release path: Bun.build (frontend)
      # → embed-asset manifest generation → bun build --compile (single
      # self-contained binary with embedded libduckdb). PRs that break any
      # of these surface here instead of in canary.
      - name: bun run build
        run: bun run build
      # In-tree launch check.
      - name: Verify binary launches
        run: ./dist/ndea --version
      # Isolated-dir launch check: copy binary to a fresh dir with no
      # siblings. Catches any regression that reintroduces sibling-file
      # lookups (rpath / LD_LIBRARY_PATH).
      - name: Verify isolated dir (single-file binary)
        env:
          ARTIFACT: ndea
        run: bash .github/scripts/verify-isolated.sh

  # ── Single required status check for branch protection ────────────────
  all-green:
    name: All checks pass
    if: always()
    needs: [check, test, build-verify]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
