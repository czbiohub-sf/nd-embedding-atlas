name: Install script

# Path-filtered: only fires when scripts/install.sh changes.
# Tests POSIX sh portability across distros (catches dash-as-/bin/sh
# regressions, Alpine BusyBox `ash` quirks, bash-3.2 macOS gaps that the
# default ubuntu/macos runners alone wouldn't surface).
#
# Pattern adapted from starship/starship's install-script.yml: lint with
# shellcheck/shfmt, then run `curl file://install.sh | sh` against a known
# pinned release tag inside multiple base-image containers.

on:
  push:
    branches: [main]
    paths: [scripts/install.sh, .github/workflows/install-script.yml]
  pull_request:
    paths: [scripts/install.sh, .github/workflows/install-script.yml]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Tag to install during portability tests. Bumped manually as we cut
# releases; pinning a known-good tag keeps the test hermetic in inputs.
env:
  PIN_TAG: v0.1.0-alpha.2

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint install.sh
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck -s sh scripts/install.sh

      - name: shfmt (POSIX flag, 4-space indent, indented case)
        run: |
          curl -fsSL https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64 -o /tmp/shfmt
          chmod +x /tmp/shfmt
          /tmp/shfmt -d -ln=posix -i 4 -ci scripts/install.sh

  # ── Portability matrix ─────────────────────────────────────────────────
  install:
    name: Install on ${{ matrix.label }}
    needs: lint
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    permissions:
      # Read-only release assets — repo is internal so install.sh
      # downloads via the authenticated API path.
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-latest (bash)
            runner: ubuntu-latest
            container: ""
            prep: ""
          - label: macos-14 (bash 3.2)
            runner: macos-14
            container: ""
            prep: ""
          - label: alpine 3.20 (BusyBox ash, musl)
            runner: ubuntu-latest
            container: alpine:3.20
            prep: apk add --no-cache curl ca-certificates bash
          - label: debian 12 slim (dash as /bin/sh)
            runner: ubuntu-latest
            container: debian:12-slim
            prep: apt-get update && apt-get install -y curl ca-certificates
          # ubuntu-24.04-arm omitted: the PIN_TAG (v0.1.0-alpha.2) was cut
          # before linux-arm64 was added to release.yml's matrix, so no
          # ndea-linux-arm64 asset exists yet. Re-add once a release with
          # all 3 platform binaries lands and PIN_TAG bumps to it.

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare base image
        if: matrix.prep != ''
        run: ${{ matrix.prep }}

      # Use POSIX sh explicitly to catch bashisms even on systems where
      # bash is the default. Run from `file://` so the test exercises the
      # local install.sh under review, not whatever's on raw.githubusercontent.com.
      - name: Run install.sh
        env:
          NDEA_VERSION: ${{ env.PIN_TAG }}
          NDEA_BIN_DIR: ${{ runner.temp }}/bin
          NDEA_HOME: ${{ runner.temp }}/state
          # Repo is private/internal — anonymous downloads 404. The
          # runner-provided GITHUB_TOKEN authenticates the API path.
          NDEA_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh scripts/install.sh

      - name: Verify install.sh produced the expected layout
        env:
          NDEA_BIN_DIR: ${{ runner.temp }}/bin
          NDEA_HOME: ${{ runner.temp }}/state
        run: |
          test -L "$NDEA_BIN_DIR/ndea" || { echo "::error::not a symlink"; exit 1; }
          test -d "$NDEA_HOME/versions/$PIN_TAG" || { echo "::error::missing versions dir"; exit 1; }
          test -x "$NDEA_HOME/versions/$PIN_TAG/ndea" || { echo "::error::binary not executable"; exit 1; }
          # NB: we deliberately don't `--version` the binary here. The
          # bun-compiled binary's libduckdb.dylib loading is broken on any
          # machine without a sibling node_modules tree (see scripts/build.ts
          # KNOWN ISSUE). This workflow's job is install.sh portability —
          # the binary's own runtime is tested in ci.yml's build-smoke job.
