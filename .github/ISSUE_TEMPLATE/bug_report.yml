name: Bug report
description: Report something that is broken or incorrect
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Share whatever you know; incomplete reports are welcome.

        Do not include credentials, personal data, confidential data, or restricted datasets.
        Report security vulnerabilities privately according to our [security policy](https://github.com/czbiohub-sf/nd-embedding-atlas/security/policy).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem, what you expected, and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: If known, list the smallest sequence that reproduces the problem. Use public or synthetic data where possible.
      placeholder: |
        1. Run `ndea …`
        2. Open …
        3. Select …
        4. Observe …

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Include anything relevant, such as the ndea version, operating system, browser, or GPU.
        `ndea --version` and `ndea doctor` can collect useful diagnostics.
      placeholder: |
        ndea version:
        Operating system:
        Browser:
        GPU:

  - type: textarea
    id: visual-evidence
    attributes:
      label: Visual evidence
      description: Add screenshots or a short recording if they help explain the problem.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add logs, error messages, or other relevant details. Remove sensitive information first.
