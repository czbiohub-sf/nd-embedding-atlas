<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embedding Picker — MuData Multi-Modal UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ['"DM Sans"', "system-ui", "sans-serif"],
              mono: ['"JetBrains Mono"', "ui-monospace", "monospace"],
            },
            colors: {
              base: "#1a1a1a",
              surface: "#282828",
              elevated: "#363636",
              "border-subtle": "rgba(255,255,255,0.10)",
              "border-active": "rgba(255,255,255,0.22)",
              "text-primary": "#f5f5f5",
              "text-secondary": "#b3b3b3",
              "text-muted": "#8a8a8a",
              "accent-blue": "#6366f1",
              "accent-cyan": "#06b6d4",
            },
          },
        },
      };
    </script>
    <style>
      body {
        background: #111114;
        font-family: "DM Sans", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .mono {
        font-family: "JetBrains Mono", ui-monospace, monospace;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      /* Dropdown animation */
      .dropdown-enter {
        animation: dropdownIn 0.15s ease-out;
      }
      @keyframes dropdownIn {
        from {
          opacity: 0;
          transform: translateY(-4px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* Radio indicator */
      .radio-dot {
        width: 14px;
        height: 14px;
        border: 1.5px solid rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: border-color 0.15s;
      }
      .radio-dot.active {
        border-color: #6366f1;
      }
      .radio-dot.active::after {
        content: "";
        width: 7px;
        height: 7px;
        background: #6366f1;
        border-radius: 50%;
      }

      /* Chevron */
      .chevron {
        transition: transform 0.15s;
      }
      .chevron.open {
        transform: rotate(180deg);
      }

      /* Section chevron */
      .section-chevron {
        transition: transform 0.15s;
      }
      .section-chevron.collapsed {
        transform: rotate(-90deg);
      }
    </style>
  </head>
  <body class="flex items-start justify-center min-h-screen pt-16">
    <div class="w-[520px] space-y-10">
      <!-- Title -->
      <div class="space-y-1">
        <h1 class="text-text-primary text-sm font-medium">Embedding Picker</h1>
        <p class="text-text-muted text-xs">Modality-grouped embedding selector for the scatter toolbar</p>
      </div>

      <!-- ═══════════════════════════════════════════════════════════════════════ -->
      <!-- State 1: Closed trigger                                                -->
      <!-- ═══════════════════════════════════════════════════════════════════════ -->
      <div class="space-y-2">
        <p class="text-text-muted text-[10px] uppercase tracking-wider font-medium">Closed state</p>
        <div class="flex items-center gap-2">
          <!-- Trigger button -->
          <button
            class="flex h-7 items-center gap-1.5 rounded-md border border-white/[0.08] bg-white/[0.04] px-2.5 text-xs text-text-primary hover:bg-white/[0.06] transition-colors min-w-[180px]"
          >
            <span class="flex-1 text-left truncate">
              <span class="text-text-muted">dinov2</span>
              <span class="text-text-muted mx-1">/</span>
              <span>UMAP</span>
            </span>
            <svg
              class="w-3 h-3 text-text-muted chevron"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path d="M6 9l6 6 6-6" />
            </svg>
          </button>
          <span class="text-text-muted text-[10px]">toolbar trigger</span>
        </div>
      </div>

      <!-- ═══════════════════════════════════════════════════════════════════════ -->
      <!-- State 2: Open dropdown — multi-modality                                -->
      <!-- ═══════════════════════════════════════════════════════════════════════ -->
      <div class="space-y-2">
        <p class="text-text-muted text-[10px] uppercase tracking-wider font-medium">Open dropdown</p>

        <div class="relative inline-block">
          <!-- Trigger (open state) -->
          <button
            class="flex h-7 items-center gap-1.5 rounded-md border border-white/[0.12] bg-white/[0.06] px-2.5 text-xs text-text-primary min-w-[180px]"
          >
            <span class="flex-1 text-left truncate">
              <span class="text-text-muted">dinov2</span>
              <span class="text-text-muted mx-1">/</span>
              <span>UMAP</span>
            </span>
            <svg
              class="w-3 h-3 text-text-muted chevron open"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path d="M6 9l6 6 6-6" />
            </svg>
          </button>

          <!-- Dropdown panel -->
          <div
            class="absolute top-full left-0 mt-1 w-[220px] rounded-lg border border-white/[0.08] bg-[#1e1e22] shadow-xl shadow-black/40 dropdown-enter overflow-hidden z-50"
          >
            <!-- Search -->
            <div class="px-2 pt-2 pb-1.5">
              <div class="flex items-center gap-1.5 rounded-md border border-white/[0.08] bg-white/[0.03] px-2 h-7">
                <svg
                  class="w-3.5 h-3.5 text-text-muted flex-shrink-0"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <circle cx="11" cy="11" r="8" />
                  <path d="m21 21-4.3-4.3" />
                </svg>
                <span class="text-text-muted text-xs">Search embeddings...</span>
              </div>
            </div>

            <!-- Modality sections -->
            <div class="max-h-[280px] overflow-y-auto pb-1">
              <!-- rna modality -->
              <div class="px-1.5 pt-1">
                <button class="flex items-center gap-1.5 px-1.5 py-1 w-full rounded text-left group">
                  <svg
                    class="w-3 h-3 text-text-muted section-chevron"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    viewBox="0 0 24 24"
                  >
                    <path d="M6 9l6 6 6-6" />
                  </svg>
                  <span
                    class="text-[10px] font-semibold uppercase tracking-wider text-text-muted group-hover:text-text-secondary"
                    >rna</span
                  >
                  <span class="text-[9px] text-text-muted/60 ml-auto mono">3</span>
                </button>
                <div class="ml-1 space-y-px">
                  <button
                    class="flex items-center gap-2 w-full rounded px-2 py-[5px] hover:bg-white/[0.04] transition-colors group"
                  >
                    <span class="radio-dot"></span>
                    <span class="text-xs text-text-secondary group-hover:text-text-primary transition-colors"
                      >UMAP</span
                    >
                    <span class="text-[9px] text-text-muted/50 ml-auto mono">2d</span>
                  </button>
                  <button
                    class="flex items-center gap-2 w-full rounded px-2 py-[5px] hover:bg-white/[0.04] transition-colors group"
                  >
                    <span class="radio-dot"></span>
                    <span class="text-xs text-text-secondary group-hover:text-text-primary transition-colors">PCA</span>
                    <span class="text-[9px] text-text-muted/50 ml-auto mono">50d</span>
                  </button>
                  <button
                    class="flex items-center gap-2 w-full rounded px-2 py-[5px] hover:bg-white/[0.04] transition-colors group"
                  >
                    <span class="radio-dot"></span>
                    <span class="text-xs text-text-secondary group-hover:text-text-primary transition-colors"
                      >PHATE</span
                    >
                    <span class="text-[9px] text-text-muted/50 ml-auto mono">2d</span>
                  </button>
                </div>
              </div>

              <!-- Divider -->
              <div class="mx-3 my-1 border-t border-white/[0.06]"></div>

              <!-- dinov2 modality -->
              <div class="px-1.5">
                <button class="flex items-center gap-1.5 px-1.5 py-1 w-full rounded text-left group">
                  <svg
                    class="w-3 h-3 text-text-muted section-chevron"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    viewBox="0 0 24 24"
                  >
                    <path d="M6 9l6 6 6-6" />
                  </svg>
                  <span
                    class="text-[10px] font-semibold uppercase tracking-wider text-text-muted group-hover:text-text-secondary"
                    >dinov2</span
                  >
                  <span class="text-[9px] text-text-muted/60 ml-auto mono">3</span>
                </button>
                <div class="ml-1 space-y-px">
                  <button
                    class="flex items-center gap-2 w-full rounded px-2 py-[5px] bg-white/[0.06] transition-colors group"
                  >
                    <span class="radio-dot active"></span>
                    <span class="text-xs text-text-primary font-medium">UMAP</span>
                    <span class="text-[9px] text-accent-blue/70 ml-auto mono">active</span>
                  </button>
                  <button
                    class="flex items-center gap-2 w-full rounded px-2 py-[5px] hover:bg-white/[0.04] transition-colors group"
                  >
                    <span class="radio-dot"></span>
                    <span class="text-xs text-text-secondary group-hover:text-text-primary transition-colors">PCA</span>
                    <span class="text-[9px] text-text-muted/50 ml-auto mono">50d</span>
                  </button>
                  <button
                    class="flex items-center gap-2 w-full rounded px-2 py-[5px] hover:bg-white/[0.04] transition-colors group"
                  >
                    <span class="radio-dot"></span>
                    <span class="text-xs text-text-secondary group-hover:text-text-primary transition-colors"
                      >PHATE</span
                    >
                    <span class="text-[9px] text-text-muted/50 ml-auto mono">3d</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ═══════════════════════════════════════════════════════════════════════ -->
      <!-- State 3: Collapsed modality section                                    -->
      <!-- ═══════════════════════════════════════════════════════════════════════ -->
      <div class="space-y-2">
        <p class="text-text-muted text-[10px] uppercase tracking-wider font-medium">Collapsed section variant</p>

        <div
          class="inline-block w-[220px] rounded-lg border border-white/[0.08] bg-[#1e1e22] shadow-xl shadow-black/40 overflow-hidden"
        >
          <div class="px-2 pt-2 pb-1.5">
            <div class="flex items-center gap-1.5 rounded-md border border-white/[0.08] bg-white/[0.03] px-2 h-7">
              <svg
                class="w-3.5 h-3.5 text-text-muted flex-shrink-0"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.3-4.3" />
              </svg>
              <span class="text-text-muted text-xs">Search embeddings...</span>
            </div>
          </div>

          <div class="pb-1">
            <!-- rna collapsed -->
            <div class="px-1.5 pt-1">
              <button
                class="flex items-center gap-1.5 px-1.5 py-1 w-full rounded text-left hover:bg-white/[0.03] group"
              >
                <svg
                  class="w-3 h-3 text-text-muted section-chevron collapsed"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <path d="M6 9l6 6 6-6" />
                </svg>
                <span
                  class="text-[10px] font-semibold uppercase tracking-wider text-text-muted group-hover:text-text-secondary"
                  >rna</span
                >
                <span class="text-[9px] text-text-muted/60 ml-auto mono">3</span>
              </button>
            </div>

            <div class="mx-3 my-1 border-t border-white/[0.06]"></div>

            <!-- dinov2 expanded with selection -->
            <div class="px-1.5">
              <button class="flex items-center gap-1.5 px-1.5 py-1 w-full rounded text-left group">
                <svg
                  class="w-3 h-3 text-text-muted section-chevron"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <path d="M6 9l6 6 6-6" />
                </svg>
                <span
                  class="text-[10px] font-semibold uppercase tracking-wider text-text-muted group-hover:text-text-secondary"
                  >dinov2</span
                >
                <span class="text-[9px] text-text-muted/60 ml-auto mono">3</span>
              </button>
              <div class="ml-1 space-y-px">
                <button class="flex items-center gap-2 w-full rounded px-2 py-[5px] bg-white/[0.06]">
                  <span class="radio-dot active"></span>
                  <span class="text-xs text-text-primary font-medium">UMAP</span>
                </button>
                <button class="flex items-center gap-2 w-full rounded px-2 py-[5px] hover:bg-white/[0.04] group">
                  <span class="radio-dot"></span>
                  <span class="text-xs text-text-secondary group-hover:text-text-primary">PCA</span>
                </button>
                <button class="flex items-center gap-2 w-full rounded px-2 py-[5px] hover:bg-white/[0.04] group">
                  <span class="radio-dot"></span>
                  <span class="text-xs text-text-secondary group-hover:text-text-primary">PHATE</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ═══════════════════════════════════════════════════════════════════════ -->
      <!-- State 4: Single modality (AnnData fallback)                            -->
      <!-- ═══════════════════════════════════════════════════════════════════════ -->
      <div class="space-y-2 pb-16">
        <p class="text-text-muted text-[10px] uppercase tracking-wider font-medium">
          Single modality (AnnData — no grouping needed)
        </p>

        <div
          class="inline-block w-[220px] rounded-lg border border-white/[0.08] bg-[#1e1e22] shadow-xl shadow-black/40 overflow-hidden"
        >
          <div class="px-2 pt-2 pb-1.5">
            <div class="flex items-center gap-1.5 rounded-md border border-white/[0.08] bg-white/[0.03] px-2 h-7">
              <svg
                class="w-3.5 h-3.5 text-text-muted flex-shrink-0"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.3-4.3" />
              </svg>
              <span class="text-text-muted text-xs">Search embeddings...</span>
            </div>
          </div>

          <div class="pb-1 px-1.5 space-y-px">
            <button class="flex items-center gap-2 w-full rounded px-2 py-[5px] bg-white/[0.06]">
              <span class="radio-dot active"></span>
              <span class="text-xs text-text-primary font-medium">UMAP</span>
              <span class="text-[9px] text-accent-blue/70 ml-auto mono">active</span>
            </button>
            <button class="flex items-center gap-2 w-full rounded px-2 py-[5px] hover:bg-white/[0.04] group">
              <span class="radio-dot"></span>
              <span class="text-xs text-text-secondary group-hover:text-text-primary">PCA</span>
              <span class="text-[9px] text-text-muted/50 ml-auto mono">50d</span>
            </button>
            <button class="flex items-center gap-2 w-full rounded px-2 py-[5px] hover:bg-white/[0.04] group">
              <span class="radio-dot"></span>
              <span class="text-xs text-text-secondary group-hover:text-text-primary">t-SNE</span>
              <span class="text-[9px] text-text-muted/50 ml-auto mono">2d</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
