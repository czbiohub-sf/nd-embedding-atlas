<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Legend — Minimal Gestures</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0a;
    color: #e8e8e8;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px;
    display: flex;
    gap: 48px;
    padding: 40px;
    flex-wrap: wrap;
    align-items: flex-start;
  }
  h3 {
    font-size: 10px;
    font-family: system-ui, sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #444;
    margin-bottom: 12px;
  }
  .glass {
    background: oklch(0.205 0 0 / 0.92);
    backdrop-filter: blur(12px);
    border: 1px solid oklch(1 0 0 / 0.07);
    border-radius: 10px;
  }
  .note {
    font-size: 10px; color: #444; max-width: 220px;
    line-height: 1.7; margin-top: 10px; font-family: system-ui, sans-serif;
  }
  .note b { color: #666; }
  kbd {
    background: oklch(0.2 0 0);
    border: 1px solid oklch(1 0 0 / 0.1);
    border-radius: 3px; padding: 1px 5px;
    font-family: inherit; font-size: 10px; color: #888;
  }

  /* ── Legend ── */
  .legend { width: 214px; padding: 6px 0 8px; }
  .legend-hdr {
    padding: 4px 12px 6px; font-size: 10px; color: #444;
    text-transform: uppercase; letter-spacing: .08em;
  }
  .legend-row {
    display: flex; align-items: center; gap: 8px;
    padding: 3px 10px; transition: background .1s;
  }
  .legend-row:hover { background: oklch(1 0 0 / 0.04); }

  /* Dot */
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    border: none; padding: 0; flex-shrink: 0;
    cursor: pointer; position: relative;
    transition: transform .12s, opacity .12s, box-shadow .12s;
  }
  .dot:hover { transform: scale(1.45); }

  /* Disabled state: hollow ring */
  .dot.off {
    background: transparent !important;
    border: 1.5px solid var(--dot-color);
    opacity: 0.5;
  }

  .legend-lbl { flex: 1; color: #999; font-size: 11px; user-select: none; }
  .legend-lbl.off { text-decoration: line-through; color: #444; }
  .legend-cnt { color: #444; font-size: 11px; flex-shrink: 0; }
  .legend-cnt.off { color: #2a2a2a; }

  /* ── Context menu (right-click) ── */
  .ctx {
    position: fixed;
    width: 224px;
    padding: 10px;
    z-index: 200;
    display: none;
    border-radius: 10px;
  }
  .ctx.open { display: block; }

  .ctx-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  }
  .ctx-swatch {
    width: 24px; height: 24px; border-radius: 5px;
    border: 1px solid oklch(1 0 0 / 0.12); flex-shrink: 0;
  }
  .ctx-title { flex: 1; font-size: 11px; color: #ddd; font-weight: 500; }
  .hex-inp {
    width: 68px; background: oklch(0.13 0 0);
    border: 1px solid oklch(1 0 0 / 0.1); border-radius: 4px;
    padding: 3px 6px; font-family: inherit; font-size: 10px;
    color: #bbb; outline: none; text-align: center;
  }
  .hex-inp:focus { border-color: oklch(1 0 0 / 0.25); color: #fff; }

  /* Sliders */
  .sl-row { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
  .sl-lbl { width: 12px; text-align: center; font-size: 10px; color: #444; flex-shrink: 0; }
  .sl-wrap { flex: 1; position: relative; height: 7px; border-radius: 3.5px; cursor: pointer; }
  .sl-wrap input[type=range] {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; cursor: pointer; margin: 0;
  }
  .sl-track { position: absolute; inset: 0; border-radius: 3.5px; pointer-events: none; }
  .sl-thumb {
    position: absolute; top: 50%; width: 12px; height: 12px;
    background: #fff; border-radius: 50%;
    border: 2px solid oklch(0.13 0 0);
    box-shadow: 0 1px 4px oklch(0 0 0 / 0.6);
    transform: translate(-50%, -50%); pointer-events: none;
  }
  .sl-val { width: 30px; text-align: right; font-size: 10px; color: #444; flex-shrink: 0; }

  .ctx-sep { height: 1px; background: oklch(1 0 0 / 0.07); margin: 8px 0; }

  .ctx-footer { display: flex; gap: 5px; }
  .btn-ghost {
    flex: 1; background: transparent;
    border: 1px solid oklch(1 0 0 / 0.08); border-radius: 5px;
    color: #444; font-size: 10px; font-family: inherit;
    padding: 5px; cursor: pointer;
    transition: border-color .1s, color .1s;
  }
  .btn-ghost:hover { border-color: oklch(1 0 0 / 0.2); color: #aaa; }
</style>
</head>
<body>

<!-- Legend -->
<div>
  <h3>Legend</h3>
  <div class="glass legend">
    <div class="legend-hdr">Categories · 3</div>
    <div class="legend-row" id="row-0">
      <button class="dot" id="dot-0"
        style="background:oklch(0.65 0.18 45); --dot-color:oklch(0.65 0.18 45)"
        onclick="toggleOff(0)"
        oncontextmenu="openCtx(event,0)"></button>
      <span class="legend-lbl" id="lbl-0">uninfected</span>
      <span class="legend-cnt" id="cnt-0">4,213</span>
    </div>
    <div class="legend-row" id="row-1">
      <button class="dot" id="dot-1"
        style="background:oklch(0.65 0.18 165); --dot-color:oklch(0.65 0.18 165)"
        onclick="toggleOff(1)"
        oncontextmenu="openCtx(event,1)"></button>
      <span class="legend-lbl" id="lbl-1">unknown</span>
      <span class="legend-cnt" id="cnt-1">3,489</span>
    </div>
    <div class="legend-row" id="row-2">
      <button class="dot" id="dot-2"
        style="background:oklch(0.55 0.22 330); --dot-color:oklch(0.55 0.22 330)"
        onclick="toggleOff(2)"
        oncontextmenu="openCtx(event,2)"></button>
      <span class="legend-lbl" id="lbl-2">infected</span>
      <span class="legend-cnt" id="cnt-2">574</span>
    </div>
  </div>
  <p class="note">
    <kbd>click</kbd> dot → toggle hide/show<br>
    <kbd>right-click</kbd> dot → edit color
  </p>
</div>

<!-- Context menu -->
<div class="glass ctx" id="ctx">
  <div class="ctx-header">
    <div class="ctx-swatch" id="ctx-swatch"></div>
    <span class="ctx-title" id="ctx-title">—</span>
    <input class="hex-inp" id="ctx-hex" value="" oninput="hexIn(this.value)" />
  </div>

  <div class="sl-row">
    <span class="sl-lbl">L</span>
    <div class="sl-wrap" id="wL">
      <div class="sl-track" id="tL"></div>
      <div class="sl-thumb" id="thL"></div>
      <input type="range" id="sL" min="0" max="1" step="0.01" oninput="syncSliders()">
    </div>
    <span class="sl-val" id="vL"></span>
  </div>
  <div class="sl-row">
    <span class="sl-lbl">C</span>
    <div class="sl-wrap" id="wC">
      <div class="sl-track" id="tC"></div>
      <div class="sl-thumb" id="thC"></div>
      <input type="range" id="sC" min="0" max="0.4" step="0.005" oninput="syncSliders()">
    </div>
    <span class="sl-val" id="vC"></span>
  </div>
  <div class="sl-row">
    <span class="sl-lbl">H</span>
    <div class="sl-wrap" id="wH">
      <div class="sl-track" id="tH"></div>
      <div class="sl-thumb" id="thH"></div>
      <input type="range" id="sH" min="0" max="360" step="1" oninput="syncSliders()">
    </div>
    <span class="sl-val" id="vH"></span>
  </div>

  <div class="ctx-sep"></div>
  <div class="ctx-footer">
    <button class="btn-ghost" onclick="resetCtx()">↺ Reset</button>
  </div>
</div>

<script>
  const cats = [
    { l:0.65, c:0.18, h:45,  off:false },
    { l:0.65, c:0.18, h:165, off:false },
    { l:0.55, c:0.22, h:330, off:false },
  ];
  const defaults = cats.map(c => ({...c}));
  let active = -1;

  // ── Color helpers ─────────────────────────────────────────────────────────
  const cvs = document.createElement('canvas');
  cvs.width = cvs.height = 1;
  const cx = cvs.getContext('2d');
  function css(l,c,h) { return `oklch(${l} ${c} ${h}deg)`; }
  function toHex(l,c,h) {
    try {
      cx.clearRect(0,0,1,1);
      cx.fillStyle = css(l,c,h);
      cx.fillRect(0,0,1,1);
      const [r,g,b] = cx.getImageData(0,0,1,1).data;
      return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
    } catch { return '#888'; }
  }

  // ── Left-click: toggle off ────────────────────────────────────────────────
  function toggleOff(i) {
    cats[i].off = !cats[i].off;
    applyDotState(i);
  }

  function applyDotState(i) {
    const dot = document.getElementById(`dot-${i}`);
    const lbl = document.getElementById(`lbl-${i}`);
    const cnt = document.getElementById(`cnt-${i}`);
    const c = cats[i];
    const color = css(c.l, c.c, c.h);
    dot.style.setProperty('--dot-color', color);
    if (c.off) {
      dot.classList.add('off');
      dot.style.background = 'transparent';
      lbl.classList.add('off');
      cnt.classList.add('off');
    } else {
      dot.classList.remove('off');
      dot.style.background = color;
      lbl.classList.remove('off');
      cnt.classList.remove('off');
    }
  }

  // ── Right-click: open color picker ───────────────────────────────────────
  const labels = ['uninfected','unknown','infected'];

  function openCtx(e, i) {
    e.preventDefault();
    active = i;
    const c = cats[i];
    document.getElementById('ctx-title').textContent = labels[i];
    document.getElementById('sL').value = c.l;
    document.getElementById('sC').value = c.c;
    document.getElementById('sH').value = c.h;
    syncSliders();
    const ctx = document.getElementById('ctx');
    ctx.classList.add('open');
    // Smart positioning: keep within viewport
    const vw = window.innerWidth, vh = window.innerHeight;
    let x = e.clientX + 6, y = e.clientY + 6;
    setTimeout(() => {
      if (x + ctx.offsetWidth  > vw) x = e.clientX - ctx.offsetWidth - 4;
      if (y + ctx.offsetHeight > vh) y = e.clientY - ctx.offsetHeight - 4;
      ctx.style.left = x + 'px';
      ctx.style.top  = y + 'px';
    }, 0);
    ctx.style.left = x + 'px';
    ctx.style.top  = y + 'px';
  }

  document.addEventListener('click', e => {
    const ctx = document.getElementById('ctx');
    if (!ctx.contains(e.target)) { ctx.classList.remove('open'); active = -1; }
  });

  // ── Slider sync ───────────────────────────────────────────────────────────
  function syncSliders() {
    const l = +document.getElementById('sL').value;
    const c = +document.getElementById('sC').value;
    const h = +document.getElementById('sH').value;
    if (active >= 0) { cats[active].l=l; cats[active].c=c; cats[active].h=h; }

    const color = css(l,c,h);
    document.getElementById('ctx-swatch').style.background = color;
    document.getElementById('ctx-hex').value = toHex(l,c,h);
    document.getElementById('vL').textContent = l.toFixed(2);
    document.getElementById('vC').textContent = c.toFixed(3);
    document.getElementById('vH').textContent = h + '°';

    // Live gradients
    document.getElementById('tL').style.background =
      `linear-gradient(to right,oklch(0 ${c} ${h}deg),oklch(0.5 ${c} ${h}deg),oklch(1 ${c} ${h}deg))`;
    document.getElementById('tC').style.background =
      `linear-gradient(to right,oklch(${l} 0 ${h}deg),oklch(${l} 0.2 ${h}deg),oklch(${l} 0.35 ${h}deg))`;
    document.getElementById('tH').style.background =
      `linear-gradient(to right,oklch(${l} ${c} 0deg),oklch(${l} ${c} 60deg),oklch(${l} ${c} 120deg),oklch(${l} ${c} 180deg),oklch(${l} ${c} 240deg),oklch(${l} ${c} 300deg),oklch(${l} ${c} 360deg))`;

    // Thumbs
    thumb('L', l/1,   'wL','thL');
    thumb('C', c/0.4, 'wC','thC');
    thumb('H', h/360, 'wH','thH');

    // Update dot live (if not off)
    if (active >= 0 && !cats[active].off)
      document.getElementById(`dot-${active}`).style.background = color;
  }

  function thumb(_, pct, wId, tId) {
    pct = Math.max(0, Math.min(1, pct));
    const w = document.getElementById(wId).offsetWidth;
    const m = 6;
    document.getElementById(tId).style.left = (m + pct*(w-m*2)) + 'px';
  }

  function hexIn(v) {
    if (v.length === 7) {
      // Production: culori.parse → oklch. Here just a visual stub.
    }
  }

  function resetCtx() {
    if (active < 0) return;
    const d = defaults[active];
    cats[active] = {...d, off: cats[active].off};
    document.getElementById('sL').value = d.l;
    document.getElementById('sC').value = d.c;
    document.getElementById('sH').value = d.h;
    syncSliders();
    applyDotState(active);
  }

  window.addEventListener('resize', () => { if (active>=0) syncSliders(); });
</script>
</body>
</html>
